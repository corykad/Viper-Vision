# Alexa-safe heat pump climate proxies.
# These hide Auto/Heat-Cool from Matterbridge so Alexa cannot choose the broken dual-setpoint path.

climate:
  - platform: viper_climate_proxy
    name: "Office"
    unique_id: "office_heat_pump_alexa"
    source: climate.office_heat_pump_office_heat_pump

  - platform: viper_climate_proxy
    name: "Living room"
    unique_id: "living_room_heat_pump_alexa"
    source: climate.living_room_heat_pump

  - platform: viper_climate_proxy
    name: "Kitchen"
    unique_id: "kitchen_heat_pump_alexa"
    source: climate.kitchen_heat_pump

  - platform: viper_climate_proxy
    name: "Jamie's room"
    unique_id: "jamies_room_heat_pump_alexa"
    source: climate.jamie_s_room_heat_pump

  - platform: viper_climate_proxy
    name: "Master bedroom"
    unique_id: "master_bedroom_heat_pump_alexa"
    source: climate.master_bedroom_heat_pump

template:
  - binary_sensor:
      - name: "Office Heat Pump Online"
        unique_id: "office_heat_pump_online"
        state: "{{ not states('climate.office_heat_pump_alexa') in ['unavailable', 'unknown'] }}"
      - name: "Living Room Heat Pump Online"
        unique_id: "living_room_heat_pump_online"
        state: "{{ not states('climate.living_room_heat_pump_alexa') in ['unavailable', 'unknown'] }}"
      - name: "Kitchen Heat Pump Online"
        unique_id: "kitchen_heat_pump_online"
        state: "{{ not states('climate.kitchen_heat_pump_alexa') in ['unavailable', 'unknown'] }}"
      - name: "Jamie's Room Heat Pump Online"
        unique_id: "jamies_room_heat_pump_online"
        state: "{{ not states('climate.jamie_s_room_heat_pump_alexa') in ['unavailable', 'unknown'] }}"
      - name: "Master Bedroom Heat Pump Online"
        unique_id: "master_bedroom_heat_pump_online"
        state: "{{ not states('climate.master_bedroom_heat_pump_alexa') in ['unavailable', 'unknown'] }}"

  - sensor:
      - name: "Office Heat Pump Last Command"
        unique_id: "office_heat_pump_last_command"
        state: "{{ state_attr('climate.office_heat_pump_alexa', 'last_command') or 'none' }}"
      - name: "Office Heat Pump Last Mode"
        unique_id: "office_heat_pump_last_mode"
        state: "{{ state_attr('climate.office_heat_pump_alexa', 'last_requested_mode') or states('climate.office_heat_pump_alexa') }}"
      - name: "Office Heat Pump Last Temperature"
        unique_id: "office_heat_pump_last_temperature"
        unit_of_measurement: "°F"
        state: "{{ state_attr('climate.office_heat_pump_alexa', 'last_requested_temperature') or state_attr('climate.office_heat_pump_alexa', 'temperature') }}"

      - name: "Living Room Heat Pump Last Command"
        unique_id: "living_room_heat_pump_last_command"
        state: "{{ state_attr('climate.living_room_heat_pump_alexa', 'last_command') or 'none' }}"
      - name: "Living Room Heat Pump Last Mode"
        unique_id: "living_room_heat_pump_last_mode"
        state: "{{ state_attr('climate.living_room_heat_pump_alexa', 'last_requested_mode') or states('climate.living_room_heat_pump_alexa') }}"
      - name: "Living Room Heat Pump Last Temperature"
        unique_id: "living_room_heat_pump_last_temperature"
        unit_of_measurement: "°F"
        state: "{{ state_attr('climate.living_room_heat_pump_alexa', 'last_requested_temperature') or state_attr('climate.living_room_heat_pump_alexa', 'temperature') }}"

      - name: "Kitchen Heat Pump Last Command"
        unique_id: "kitchen_heat_pump_last_command"
        state: "{{ state_attr('climate.kitchen_heat_pump_alexa', 'last_command') or 'none' }}"
      - name: "Kitchen Heat Pump Last Mode"
        unique_id: "kitchen_heat_pump_last_mode"
        state: "{{ state_attr('climate.kitchen_heat_pump_alexa', 'last_requested_mode') or states('climate.kitchen_heat_pump_alexa') }}"
      - name: "Kitchen Heat Pump Last Temperature"
        unique_id: "kitchen_heat_pump_last_temperature"
        unit_of_measurement: "°F"
        state: "{{ state_attr('climate.kitchen_heat_pump_alexa', 'last_requested_temperature') or state_attr('climate.kitchen_heat_pump_alexa', 'temperature') }}"

      - name: "Jamie's Room Heat Pump Last Command"
        unique_id: "jamies_room_heat_pump_last_command"
        state: "{{ state_attr('climate.jamie_s_room_heat_pump_alexa', 'last_command') or 'none' }}"
      - name: "Jamie's Room Heat Pump Last Mode"
        unique_id: "jamies_room_heat_pump_last_mode"
        state: "{{ state_attr('climate.jamie_s_room_heat_pump_alexa', 'last_requested_mode') or states('climate.jamie_s_room_heat_pump_alexa') }}"
      - name: "Jamie's Room Heat Pump Last Temperature"
        unique_id: "jamies_room_heat_pump_last_temperature"
        unit_of_measurement: "°F"
        state: "{{ state_attr('climate.jamie_s_room_heat_pump_alexa', 'last_requested_temperature') or state_attr('climate.jamie_s_room_heat_pump_alexa', 'temperature') }}"

      - name: "Master Bedroom Heat Pump Last Command"
        unique_id: "master_bedroom_heat_pump_last_command"
        state: "{{ state_attr('climate.master_bedroom_heat_pump_alexa', 'last_command') or 'none' }}"
      - name: "Master Bedroom Heat Pump Last Mode"
        unique_id: "master_bedroom_heat_pump_last_mode"
        state: "{{ state_attr('climate.master_bedroom_heat_pump_alexa', 'last_requested_mode') or states('climate.master_bedroom_heat_pump_alexa') }}"
      - name: "Master Bedroom Heat Pump Last Temperature"
        unique_id: "master_bedroom_heat_pump_last_temperature"
        unit_of_measurement: "°F"
        state: "{{ state_attr('climate.master_bedroom_heat_pump_alexa', 'last_requested_temperature') or state_attr('climate.master_bedroom_heat_pump_alexa', 'temperature') }}"

  - fan:
      - name: "Airflow Office"
        unique_id: "office_heat_pump_airflow"
        state: "{{ not states('climate.office_heat_pump_office_heat_pump') in ['off', 'unavailable', 'unknown'] }}"
        percentage: >
          {% set mode = state_attr('climate.office_heat_pump_office_heat_pump', 'fan_mode') %}
          {{ {'auto': 25, 'quiet': 40, 'low': 55, 'medium': 75, 'high': 100}.get(mode, 0) }}
        preset_mode: "{{ state_attr('climate.office_heat_pump_office_heat_pump', 'fan_mode') or 'auto' }}"
        preset_modes:
          - auto
          - quiet
          - low
          - medium
          - high
        speed_count: 4
        turn_on:
          - action: logbook.log
            data:
              name: Viper Airflow
              message: "Ignored Airflow Office turn_on; speed commands send the actual IR."
        turn_off:
          - action: climate.turn_off
            target:
              entity_id: climate.office_heat_pump_office_heat_pump
        set_percentage:
          - variables:
              requested_fan_mode: >-
                {% if percentage <= 0 %}off{% elif percentage <= 30 %}auto{% elif percentage <= 45 %}quiet{% elif percentage <= 60 %}low{% elif percentage <= 85 %}medium{% else %}high{% endif %}
          - if:
              - condition: template
                value_template: "{{ requested_fan_mode == 'off' }}"
            then:
              - action: climate.turn_off
                target:
                  entity_id: climate.office_heat_pump_office_heat_pump
            else:
              - if:
                  - condition: template
                    value_template: "{{ state_attr('climate.office_heat_pump_office_heat_pump', 'fan_mode') != requested_fan_mode }}"
                then:
                  - action: climate.set_fan_mode
                    target:
                      entity_id: climate.office_heat_pump_office_heat_pump
                    data:
                      fan_mode: "{{ requested_fan_mode }}"
        set_preset_mode:
          - if:
              - condition: template
                value_template: "{{ preset_mode == 'off' }}"
            then:
              - action: climate.turn_off
                target:
                  entity_id: climate.office_heat_pump_office_heat_pump
            else:
              - if:
                  - condition: template
                    value_template: "{{ state_attr('climate.office_heat_pump_office_heat_pump', 'fan_mode') != preset_mode }}"
                then:
                  - action: climate.set_fan_mode
                    target:
                      entity_id: climate.office_heat_pump_office_heat_pump
                    data:
                      fan_mode: "{{ preset_mode }}"

