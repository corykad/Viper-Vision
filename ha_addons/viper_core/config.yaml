name: Viper Core
version: "0.1.0"
slug: viper_core
description: Always-on Viper event engine for Home Assistant
url: https://github.com/corykad/Viper-Vision
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:snake
panel_title: Viper Core
hassio_api: true
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Viper Core health and setup page
options:
  log_level: info
  health_check_seconds: 60
  enabled_features:
    doorbell: true
    fridge: true
    vacuum: true
    hvac: true
    ice_maker: true
  notification_service: persistent_notification.create
  doorbell_speaker_service: ""
  fridge_speaker_service: ""
  vacuum_speaker_service: ""
  pushover_service: ""
  speaker_targets: []
  fallback_ha_url: ""
  fallback_ha_token: ""
schema:
  log_level: list(trace|debug|info|warning|error)
  health_check_seconds: int(15,3600)
  enabled_features:
    doorbell: bool
    fridge: bool
    vacuum: bool
    hvac: bool
    ice_maker: bool
  notification_service: str?
  doorbell_speaker_service: str?
  fridge_speaker_service: str?
  vacuum_speaker_service: str?
  pushover_service: str?
  speaker_targets:
    - str
  fallback_ha_url: str?
  fallback_ha_token: str?
